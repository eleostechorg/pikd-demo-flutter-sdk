name: pikd_flutter_demo
description: "Host-app handoff demo for the turnkey PIKD Flutter experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The single turnkey PIKD dependency. Its API, UI, AR, location, and visual
  # dependencies resolve transitively from pub.dev.
  pikd_flutter_experience: ^0.8.0-beta.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
